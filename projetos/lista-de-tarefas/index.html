<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <h1>📋 Lista de Tarefas</h1>

    <form id="formTarefa">
      <input type="text" id="novaTarefa" placeholder="O que você precisa fazer?" required>
      <button type="submit">Adicionar</button>
    </form>

    <p class="contador" id="contador">0 tarefa(s) pendente(s)</p>

    <ul id="lista"></ul>

    <p class="vazio" id="vazio">Nenhuma tarefa ainda. Adicione a primeira! 🚀</p>

    <button class="limpar" id="limpar">Limpar concluídas</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
